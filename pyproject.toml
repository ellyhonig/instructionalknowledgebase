[project]
name = "bjjvault"
version = "0.1.0"
description = "Collect BJJ instructionals, transcribe them, organize into an Obsidian vault, and search them semantically with clips."
requires-python = ">=3.11,<3.13"
dependencies = [
    "yt-dlp>=2025.1.1",
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "fastembed>=0.4",
    "numpy>=1.26",
    "mcp>=1.26,<2",
]

[project.scripts]
bjjvault = "bjjvault.cli:main"
bjjvault-mcp = "bjjvault.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
